name: CI - Test and Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install and smoke test
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          python -c "import sys; sys.path.insert(0,'app'); from app import app; c=app.test_client(); assert c.get('/healthz').status_code == 200"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.SERVICE_PRINCIPAL }}

      - name: Validate Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -input=false
      - run: terraform -chdir=terraform validate
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -var-file=dev.tfvars -input=false -no-color

      - name: Scan filesystem and IaC
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          exit-code: "1"
          severity: HIGH,CRITICAL
